# Installed by scripts/setup.sh as /etc/systemd/journald.conf.d/openseedling.conf.
# Keeps the system log from wearing the SD card or filling it: a hard size cap,
# free space it never eats into, and a month of history. The controller logs a
# few lines a minute at most, so a month fits comfortably.
[Journal]
SystemMaxUse=50M
SystemKeepFree=1G
RuntimeMaxUse=20M
MaxRetentionSec=1month
