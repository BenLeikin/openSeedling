# Run: ruff check . && ruff format --check .
#   E501  the formatter wraps code; long strings and comments are left alone
#   B905  zip() without strict=: every zip here is over equal-length lists
target-version = "py311"
line-length = 100
exclude = ["venv", "timelapse", "timelapse_archive"]

[lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905"]

[lint.per-file-ignores]
# the suite copies the app to a temp directory and fakes the hardware
# modules before it can import anything from it
"tests/*" = ["E402"]

[format]
quote-style = "double"
