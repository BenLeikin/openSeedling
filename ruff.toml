# Run: ruff check . && ruff format --check .
#   E402  some modules import each other and finish their imports at the bottom
#   E501  the formatter wraps code; long strings and comments are left alone
#   B905  zip() without strict=: every zip here is over equal-length lists
target-version = "py311"
line-length = 100
exclude = ["venv", "timelapse", "timelapse_archive"]

[lint]
select = ["E", "F", "W", "B"]
ignore = ["E402", "E501", "B905"]

[format]
quote-style = "double"
