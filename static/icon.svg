<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="OpenSeedling">
  <!-- Favicons render at 16px. Everything here is deliberately heavy: thick
       stems, few shapes, high contrast against the tile. Detail below ~3px of
       stroke turns to mush at tab size. -->
  <rect width="64" height="64" rx="14" fill="#27432e"/>

  <!-- soil line -->
  <path d="M14 47h36" stroke="#4a3826" stroke-width="7" stroke-linecap="round"/>

  <!-- stem -->
  <path d="M32 47V26" stroke="#7fb069" stroke-width="6" stroke-linecap="round"/>

  <!-- two cotyledons, mirrored -->
  <path d="M32 30c-11 0-16-5-16-12 8-2 16 3 16 12z" fill="#7fb069"/>
  <path d="M32 26c0-9 6-14 15-13 1 8-5 14-15 13z" fill="#a8d08a"/>
</svg>
