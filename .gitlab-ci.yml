# Lint, formatting and the server test suite on every push. The suite fakes
# GPIO, PWM and I2C, so it needs only the web packages from requirements.txt
# and OpenCV for the image checks.
stages:
  - check

python:
  stage: check
  image: python:3.13-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    - pip install -q $(grep -E "^(Flask|waitress|astral)==" requirements.txt) $(grep -E "^(ruff|pytest|mypy)" requirements-dev.txt)
    - pip install -q -r requirements-optional.txt  # OpenCV, so the image checks run
  script:
    - ruff check .
    - ruff format --check .
    - mypy
    - python -m pytest

javascript:
  stage: check
  image: node:22-slim
  cache:
    paths:
      - node_modules
  before_script:
    - npm ci --no-audit --no-fund
  script:
    - npm run lint
    - npm run format:check
