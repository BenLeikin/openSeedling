# pre-commit hooks: pip install pre-commit && pre-commit install
# They use the tools already in this repo's setup: ruff (pip), and Prettier and
# ESLint from `npm install` (development only).
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
      - id: prettier
        name: prettier --check
        entry: npx prettier --check
        language: system
        files: ^static/.*\.(js|css)$
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: ^static/.*\.js$
