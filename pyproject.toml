# Project metadata. Dependencies are pinned in requirements.txt (installed by
# scripts/setup.sh into the Pi's venv); lint settings are in ruff.toml,
# eslint.config.mjs and .prettierrc.json.
[project]
name = "openseedling"
version = "63"
description = "Raspberry Pi seedling controller and web dashboard: grow light, watering, heat mat, camera and timelapse"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# The modules with no hardware or web framework in them are fully annotated
# and checked strictly. The rest of the app is not annotated yet, so what
# these import from it is taken on trust.
python_version = "3.11"
files = ["alerts.py", "events.py", "quality.py", "tools.py", "units.py"]
strict = true
follow_imports = "silent"
